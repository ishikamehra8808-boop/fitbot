<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitBot - AI Fitness Assistant</title>
    <style>
        :root {
            /* Colors */
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a2e;
            --bg-input: #232342;
            --text-main: #f5f5f7;
            --text-muted: #a0a0b8;
            --accent-bot: #00d4aa; /* Teal/Green */
            --accent-user: #667eea; /* Purple-Blue */
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-subtle: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 15px rgba(0, 212, 170, 0.2);
            
            /* Fonts & Spacing */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            height: 100%;
            background-color: var(--bg-dark);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: var(--spacing-md) var(--spacing-lg);
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-subtle);
            z-index: 10;
        }

        .header-icon {
            font-size: 28px;
            margin-right: var(--spacing-md);
            background: linear-gradient(135deg, var(--accent-bot), var(--accent-user));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--shadow-glow);
        }

        .header-title-container {
            flex-grow: 1;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-bot);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 212, 170, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 212, 170, 0); }
        }

        /* Chat Area */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            scroll-behavior: smooth;
        }
        
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 3px;
        }

        /* Messages */
        .message-wrapper {
            display: flex;
            width: 100%;
            animation: slideUpFade 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.bot {
            justify-content: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
            flex-shrink: 0;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .message-content {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            line-height: 1.5;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .bot .message-content {
            background-color: var(--bg-card);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .user .message-content {
            background: linear-gradient(135deg, var(--accent-user), #4c5fd5);
            border-bottom-right-radius: 4px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
        }

        /* Markdown Styling inside Messages */
        .message-content p { margin-bottom: 0.75em; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content strong { font-weight: 700; color: #fff; }
        .bot .message-content strong { color: var(--accent-bot); }
        .message-content em { font-style: italic; }
        
        .message-content h1, .message-content h2, .message-content h3 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }
        .message-content h1 { font-size: 1.4rem; }
        .message-content h2 { font-size: 1.2rem; }
        .message-content h3 { font-size: 1.1rem; }
        
        .message-content ul, .message-content ol {
            margin-bottom: 0.75em;
            padding-left: 1.5em;
        }
        .message-content li { margin-bottom: 0.25em; }
        
        .message-content code {
            font-family: monospace;
            background-color: rgba(0,0,0,0.3);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        
        .message-content pre {
            background-color: #000;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 0.75em;
        }
        .message-content pre code {
            background-color: transparent;
            padding: 0;
        }

        /* Sources */
        .sources-container {
            margin-top: 8px;
            font-size: 0.8rem;
        }
        
        .sources-toggle {
            cursor: pointer;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            transition: color 0.2s;
        }
        
        .sources-toggle:hover {
            color: var(--text-main);
        }
        
        .sources-list {
            display: none;
            margin-top: 6px;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        
        .sources-list.active {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .source-item {
            color: var(--accent-bot);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .source-item:hover { text-decoration: underline; }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 14px 18px;
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-container {
            padding: var(--spacing-md) var(--spacing-lg) calc(var(--spacing-md) + env(safe-area-inset-bottom, 0px));
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        /* Chips */
        .chips-container {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 8px;
            margin-bottom: 4px;
            scrollbar-width: none; /* Firefox */
        }
        
        .chips-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .chip {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .chip:hover {
            background-color: var(--bg-input);
            color: var(--text-main);
            border-color: var(--accent-user);
            transform: translateY(-2px);
        }

        /* Input Form */
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-user);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            padding: 8px 12px;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 24px;
            font-family: inherit;
            line-height: 1.5;
            overflow-y: auto;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-user), #4c5fd5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 8px;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            margin-left: 2px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <div class="header-icon">💪</div>
        <div class="header-title-container">
            <h1 class="header-title">FitBot</h1>
            <div class="header-subtitle">
                <span class="status-dot"></span> AI Fitness Assistant
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="chat-container" id="chatContainer">
        <!-- Messages will be injected here -->
    </main>

    <!-- Input Area -->
    <footer class="input-container">
        <div class="chips-container" id="chipsContainer">
            <!-- Chips will be injected here -->
        </div>
        
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Ask about workouts, nutrition..." rows="1"></textarea>
            <button id="sendBtn" class="send-btn" disabled>
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </footer>
</div>

<script>
    // State
    const state = {
        history: [],
        isResponding: false,
        suggestedQuestions: [
            "Create a beginner workout plan",
            "How much protein do I need?",
            "Best exercises for chest?",
            "How to improve flexibility?",
            "Explain progressive overload",
            "Pre-workout nutrition tips"
        ]
    };

    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chipsContainer = document.getElementById('chipsContainer');

    // Simple Markdown Parser (Regex based)
    function parseMarkdown(text) {
        if (!text) return '';
        
        let html = text;
        
        // Escape HTML
        html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        
        // Code blocks
        html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        
        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        // Bold
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        
        // Italic
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        
        // Headers
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
        
        // Unordered lists (simple)
        html = html.replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>');
        html = html.replace(/<\/ul>\n<ul>/g, '\n'); // Merge adjacent lists
        
        // Numbered lists (simple)
        html = html.replace(/^\d+\. (.*$)/gim, '<ol><li>$1</li></ol>');
        html = html.replace(/<\/ol>\n<ol>/g, '\n');
        
        // Line breaks (for paragraphs not inside lists/pre)
        // A simple approach: split by double newline for paragraphs, single newline for br
        const blocks = html.split(/\n\n+/);
        html = blocks.map(block => {
            if (block.startsWith('<pre>') || block.startsWith('<ul>') || block.startsWith('<ol>') || block.startsWith('<h')) {
                return block;
            }
            return `<p>${block.replace(/\n/g, '<br>')}</p>`;
        }).join('');
        
        return html;
    }

    // Auto-resize textarea
    function autoResize() {
        userInput.style.height = 'auto';
        userInput.style.height = (userInput.scrollHeight) + 'px';
        
        // Update button state
        if (userInput.value.trim() && !state.isResponding) {
            sendBtn.disabled = false;
        } else {
            sendBtn.disabled = true;
        }
    }

    userInput.addEventListener('input', autoResize);

    // Render chips
    function renderChips() {
        chipsContainer.innerHTML = '';
        state.suggestedQuestions.forEach(q => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.textContent = q;
            chip.onclick = () => {
                if (state.isResponding) return;
                userInput.value = q;
                autoResize();
                sendMessage();
            };
            chipsContainer.appendChild(chip);
        });
    }

    // Scroll to bottom
    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Create Message Element
    function createMessageElement(role, content = '') {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}`;
        
        let innerHTML = '';
        if (role === 'bot') {
            innerHTML += `<div class="avatar">🤖</div>`;
        }
        
        innerHTML += `<div class="message-content">${parseMarkdown(content)}</div>`;
        
        wrapper.innerHTML = innerHTML;
        return wrapper;
    }

    // Create Typing Indicator
    function createTypingIndicator() {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper bot';
        wrapper.id = 'typingIndicator';
        wrapper.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        return wrapper;
    }

    // Add sources UI to bot message
    function appendSources(messageEl, sources) {
        if (!sources || sources.length === 0) return;
        
        const contentDiv = messageEl.querySelector('.message-content');
        
        const sourcesContainer = document.createElement('div');
        sourcesContainer.className = 'sources-container';
        
        const toggle = document.createElement('div');
        toggle.className = 'sources-toggle';
        toggle.innerHTML = '<span>📚 Sources</span> <span>▼</span>';
        
        const list = document.createElement('div');
        list.className = 'sources-list';
        
        sources.forEach(src => {
            const link = document.createElement('a');
            link.className = 'source-item';
            link.href = '#'; // In reality might link somewhere
            link.title = src;
            link.textContent = src.split('/').pop() || src;
            list.appendChild(link);
        });
        
        toggle.onclick = () => {
            list.classList.toggle('active');
            toggle.innerHTML = list.classList.contains('active') ? '<span>📚 Sources</span> <span>▲</span>' : '<span>📚 Sources</span> <span>▼</span>';
        };
        
        sourcesContainer.appendChild(toggle);
        sourcesContainer.appendChild(list);
        contentDiv.appendChild(sourcesContainer);
    }

    // Send Message Logic
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || state.isResponding) return;

        // 1. Add user message to UI and state
        const userMsg = { role: 'user', content: text };
        state.history.push(userMsg);
        chatContainer.appendChild(createMessageElement('user', text));
        
        // 2. Clear input
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;
        scrollToBottom();

        // 3. Show typing indicator
        state.isResponding = true;
        const typingEl = createTypingIndicator();
        chatContainer.appendChild(typingEl);
        scrollToBottom();

        try {
            // Setup Bot Message Element (empty initially)
            const botMsgEl = createMessageElement('bot', '');
            const contentContainer = botMsgEl.querySelector('.message-content');
            let botFullResponse = '';
            let sources = [];

            // 4. API Request (Simulated or Real depending on environment)
            // As per requirements: Send messages to POST /api/chat/stream endpoint
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    history: state.history.slice(0, -1)
                })
            });

            // Replace typing indicator with actual message element
            typingEl.remove();
            chatContainer.appendChild(botMsgEl);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            // 5. Parse SSE Stream
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const data = JSON.parse(line.slice(6));
                            
                            // Handle token
                            if (data.text) {
                                botFullResponse += data.text;
                                contentContainer.innerHTML = parseMarkdown(botFullResponse);
                                scrollToBottom();
                            }
                            
                            // Handle sources (metadata)
                            if (data.sources) {
                                sources = data.sources;
                            }
                        } catch (e) {
                            console.error('Error parsing SSE data', e);
                        }
                    }
                }
            }

            // Append sources if available
            if (sources.length > 0) {
                appendSources(botMsgEl, sources);
            }

            // Update history
            state.history.push({ role: 'assistant', content: botFullResponse });

        } catch (error) {
            console.error('Chat Error:', error);
            typingEl.remove();
            
            // Show error message
            const errorMsg = "Sorry, I'm having trouble connecting right now. Let's try again later! 🔌";
            chatContainer.appendChild(createMessageElement('bot', errorMsg));
            state.history.push({ role: 'assistant', content: errorMsg });
        } finally {
            state.isResponding = false;
            if (userInput.value.trim()) sendBtn.disabled = false;
            scrollToBottom();
        }
    }

    // Event Listeners
    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Initialization
    function init() {
        renderChips();
        
        // Initial bot welcome message
        const welcomeText = "Hey there! 💪 I'm **FitBot**, your AI fitness assistant. I can help you with:\n\n- 🏋️ **Workout Plans** - Custom routines for any level\n- 🥗 **Nutrition Advice** - Macros, meal plans, and diet tips\n- 💊 **Supplements** - Evidence-based recommendations\n- 🧘 **Recovery** - Rest, mobility, and injury prevention\n- 🏃 **Cardio** - HIIT, LISS, and endurance training\n\nAsk me anything about fitness!";
        
        chatContainer.appendChild(createMessageElement('bot', welcomeText));
        state.history.push({ role: 'assistant', content: welcomeText });
    }

    // Run init
    window.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
